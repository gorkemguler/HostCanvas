name: host-canvas

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      TLS_SENTINEL_DATA_DIR: /data
      TLS_SENTINEL_API_HOST: 0.0.0.0
      TLS_SENTINEL_API_PORT: 8787
      TLS_SENTINEL_WEB_HOST: 0.0.0.0
      TLS_SENTINEL_WEB_PORT: 3000
      TLS_SENTINEL_UI_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TLS_SENTINEL_ALLOW_PRIVATE_TARGETS: ${TLS_SENTINEL_ALLOW_PRIVATE_TARGETS:-false}
      TLS_SENTINEL_PUBLIC_DNS_RESOLVER: ${TLS_SENTINEL_PUBLIC_DNS_RESOLVER:-}
      TLS_SENTINEL_CRT_NAME_ENABLED: ${TLS_SENTINEL_CRT_NAME_ENABLED:-true}
      TLS_SENTINEL_CRT_NAME_LIMIT: ${TLS_SENTINEL_CRT_NAME_LIMIT:-200}
      TLS_SENTINEL_SECRET_KEY: ${TLS_SENTINEL_SECRET_KEY:-}
      TLS_SENTINEL_MAX_CONCURRENT_SCANS: ${TLS_SENTINEL_MAX_CONCURRENT_SCANS:-2}
      TLS_SENTINEL_TRUST_PROXY: 'true'
    volumes:
      - tls_sentinel_data:/data
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:8787:8787
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/bootstrap').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - 3443:3443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  tls_sentinel_data:
  caddy_data:
  caddy_config:
